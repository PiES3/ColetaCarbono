[project]
name = "coletacarbono"
version = "0.1.0"
description = "Sistema de calculo, registro e validação de emição de carbono"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "dotenv>=0.9.9",
    "fastapi>=0.142.3",
    "gunicorn>=26.2.0",
    "loguru>=0.7.3",
    "passlib[bcrypt]>=1.7.4",
    "pathlib>=1.0.1",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "FAST"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

